name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run tests
        run: uv run --frozen --python ${{ matrix.python-version }} pytest -q

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: uv build

      - name: Validate metadata
        run: uvx --from twine --with 'readme-renderer[md]' twine check dist/*

      - name: Install the wheel and smoke test it
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c "
          import koreacoord
          assert koreacoord.transform(126.9784, 37.5666, 'WGS84', 'WCONGNAMUL') == (495229, 1129740)
          print('ok', koreacoord.__version__)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
