name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run tests
        run: uv run --frozen --python ${{ matrix.python-version }} pytest -q

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: uv build

      - name: Validate metadata
        run: uvx --from twine --with 'readme-renderer[md]' twine check --strict dist/*

      - name: Verify the README renders the way PyPI will render it
        run: |
          uv run --isolated --no-project --with 'readme-renderer[md]' python - <<'PY'
          import pathlib, sys
          import readme_renderer.markdown as md

          # 렌더러가 없으면 render() 가 조용히 None 을 돌려주고 twine check 는 그냥 통과한다.
          html = md.render(pathlib.Path("README.md").read_text(encoding="utf-8"))
          if html is None:
              sys.exit("README did not render; PyPI would show the raw text")
          for needle, label in (("<table", "tables"), ("<pre", "code blocks"), ("<img", "badges")):
              if needle not in html:
                  sys.exit(f"rendered README is missing {label}")
          print(f"README renders to {len(html)} bytes, with tables, code blocks and badges")
          PY

      - name: Install the wheel and smoke test it
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c "
          import koreacoord
          assert koreacoord.transform(126.9784, 37.5666, 'WGS84', 'WCONGNAMUL') == (495229, 1129740)
          print('ok', koreacoord.__version__)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
